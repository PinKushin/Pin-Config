// Competitive profile: max frames, with three deliberate exceptions.
//
// `exec comp` -- this is low.cfg plus the overrides below, not a third profile.
// Everything not listed here comes from low.cfg, so there is one place to change a
// performance setting.
//
// Reconstructed from this repo's first commit (cfg/autoexec.cfg at 6e06111), which is
// the config actually played on. Values are that config's, not invented.
//
// THE PHILOSOPHY, which is what makes the exceptions coherent rather than arbitrary:
// world detail down, PLAYER-RELEVANT detail up. Everything you cannot shoot is cheap.

exec low

// ---------------------------------------------------------------------------------
// 1. Shadows ON
// ---------------------------------------------------------------------------------
// TF2 does not clip dynamic shadows through thin geometry, so a player behind a
// sufficiently thin wall still casts a shadow onto your side. Shadows are an
// information source, not decoration -- the known case being sawroom on Snakewater,
// where the wall backing onto mid reads through.
//
// Note r_shadowmaxrendered 11, NOT ultra.cfg's 160. Eleven is roughly a 6v6 server's
// worth of players; the rest of the map's shadows are not what you are looking at, and
// rendering 160 of them buys nothing and costs frames. The original config's own
// warning: expect to lose 15-20% framerate to shadows, and keep them off if you are
// already near your refresh rate.
mat_shadowstate 1                          // ~ master switch for the shadow system
r_shadows 1                                // Enable/disable shadows
r_shadowrendertotexture 1                  // ~ real shadows rather than blobs
r_shadowmaxrendered 11                     // ~ cap on simultaneous shadows; ~one team

// ---------------------------------------------------------------------------------
// 2. Model detail UP
// ---------------------------------------------------------------------------------
// r_lod 0 is the highest model detail; low.cfg uses 2. Player models are the thing you
// are aiming at, so they get the detail. World detail deliberately stays cheap --
// r_rootlod 2 and r_staticprop_lod 4 are identical in both profiles and are NOT
// overridden here.
r_lod 0                                    // ~ model LOD; 0 = highest detail

// ---------------------------------------------------------------------------------
// 3. Textures sharper
// ---------------------------------------------------------------------------------
// mat_picmip -1 is sharper than default; low.cfg uses 2, which is blurry.
//
// THE REASON WAS NOT RECORDED AT THE TIME and the owner no longer remembers it. What he
// recalls are candidates, not the decision:
//
//   * contrast helping players stand out against the map
//   * fire being harder to see through at lower settings
//   * picking out heads at long range on Sniper
//
// The last one has a mechanical story behind it -- r_lod 0 above keeps model detail
// high at distance, and a head is a small target made of exactly that detail -- but
// nobody wrote it down, so it stays a plausible explanation rather than the reason.
// Recorded as an honest gap; an invented rationale would read as authoritative and be
// worse than nothing.
//
// Anisotropic filtering stays off, as in the original.
mat_picmip -1                              // ~ texture detail; negative is sharper
mat_forceaniso 0                           // ~ anisotropic filtering off

echo "comp.cfg -- low.cfg + shadows on, r_lod 0, mat_picmip -1"
