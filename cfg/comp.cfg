// Competitive profile: max frames, shadows deliberately ON.
//
// `exec comp` -- this is low.cfg plus one exception, not a third profile. Everything
// not mentioned below comes from low.cfg and stays there, so there is exactly one place
// to change a performance setting.
//
// WHY SHADOWS ARE ON IN A MAX-FRAMES CONFIG
//
// TF2 does not clip dynamic shadows through thin geometry. A player standing behind a
// sufficiently thin wall still casts a shadow that renders on your side of it, so
// shadows are an information source rather than decoration. The known example is
// sawroom on Snakewater, where the wall backing onto mid is thin enough that shadows
// read through it.
//
// That is worth more than the frames it costs, which is the only reason to turn
// anything up in a config whose entire purpose is turning things down.

exec low

// ---------------------------------------------------------------------------------
// The exception
// ---------------------------------------------------------------------------------
// Values taken from ultra.cfg rather than invented, so there is one source for what
// "shadows on" means. low.cfg sets all of these to 0.
r_shadows 1                                // Enable/disable shadows
r_shadowrendertotexture 1                  // ~ render shadows to texture; sharper than blobs
r_shadowmaxrendered 160                    // ~ cap on simultaneously rendered shadows

// Flashlight depth textures are what make the projected shadows above resolve properly
// rather than fall back to blob shadows.
r_flashlightdepthtexture 1                 // ~ use depth textures for projected shadows

echo "comp.cfg loaded -- low.cfg with shadows ON (thin-wall vision, e.g. Snakewater sawroom)"
