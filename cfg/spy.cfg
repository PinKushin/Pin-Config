// Spy wants the player model panel, to read own disguise.
cl_hud_playerclass_use_playermodel 1

// Disguise as enemy medic, then drop back to the last disguise.
alias medcheck  medcheck1
alias medcheck1 "disguise 5 -1; slot2; alias medcheck medcheck2"
alias medcheck2 "lastdisguise; alias medcheck medcheck1"
bind KP_PGUP medcheck

bind mouse2 +attack2

// Per-slot viewmodels, then the Spy exception: the SAPPER is shown.
// Spy's slots are revolver / sapper / knife / disguise kit / watch, so slot2 here is a
// utility item rather than a gun and the placement animation is worth seeing. The
// other four already match the default (revolver hidden, the rest shown).
exec viewmodels
alias s2 "slot2; vm_show"
bind 2 s2
