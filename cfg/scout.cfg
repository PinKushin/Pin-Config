// Winger jump. Right mouse switches to secondary, crouch-jumps, and switches back.
//
// The Winger gives +25% jump height while it is the ACTIVE weapon, so swapping to
// it for the jump and straight back to the scattergun is faster than doing it by
// hand. Note the bonus is the Winger's specifically -- the stock Pistol and the
// Pretty Boy's Pocket Pistol do not have it, so with either of those equipped this
// swaps weapons for no gain.
//
// `weapon1` and `weapon2` are NOT TF2 commands and never were. They threw
// "Unknown command" on every press, so the jump and crouch worked while the weapon
// swap silently did nothing -- which is why the higher jump never happened. TF2
// uses slot1 (primary), slot2 (secondary), slot3 (melee).
//
// On release the order is deliberate: release jump and crouch FIRST, then switch
// back. Jump height is decided at the moment of the jump, so returning to the
// scattergun afterwards costs nothing, but doing it before the release is one more
// thing happening in the same tick.
alias +wjump "slot2; +jump; +duck"
alias -wjump "-jump; -duck; slot1"
bind mouse2 +wjump
