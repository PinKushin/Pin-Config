// Winger jump. Right mouse switches to secondary, crouch-jumps, and switches back.
//
// The Winger gives +25% jump height while it is the ACTIVE weapon, so swapping to it
// for the jump and straight back to the scattergun is faster than doing it by hand.
// The bonus is the Winger's specifically -- the stock Pistol and the Pretty Boy's
// Pocket Pistol do not have it.
//
// HISTORY, because I got this wrong once. This originally read
//   alias +wjump "weapon2; +jump; +duck"
// and I "fixed" it to slot2/slot1 on the grounds that weapon1/weapon2 are not TF2
// commands. They are not -- but they WERE aliases, defined by the crosshair/viewmodel
// switcher this config used to carry (see cfg/crosshairswitcher/ in the first commit).
// The script was correct for the config it was written in, and broke when the switcher
// was removed, not because it was ever wrong.
//
// Now it uses w2/w1, which are that switcher's successors in cfg/viewmodels.cfg. Raw
// slot commands would work but would desync the viewmodel state machine, so the next
// lastweapon press would show or hide the wrong thing.
//
// On release, jump and crouch are let go BEFORE switching back: jump height is decided
// at the moment of the jump, so returning to the scattergun afterwards costs nothing.
alias +wjump "w2; +jump; +duck"
alias -wjump "-jump; -duck; w1"
bind mouse2 +wjump

// Viewmodels: guns hidden, melee shown. The engine is exec'd fresh on each class
// change so one class's settings cannot leak into the next, then the entry point binds
// this class's per-slot choices and puts you on primary.
exec viewmodels
vm_scout
