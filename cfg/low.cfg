// ===========================================================================
// low.cfg -- max frames, for playing.
//
// Descended from Comanglia's config (v1.4, 2014), which was good at its job.
// Refreshed against `cvarlist` on 2026-08-16: seven of its cvars no longer
// exist and are gone rather than left to print "Unknown command".
//
//   removed, no modern equivalent:  mat_shadowstate  mat_parallaxmap
//                                   cl_threaded_bone_setup  cl_cloud_settings
//                                   cl_loadondemand_default  cl_forcepreload
//   renamed:                        cl_playerspraydisable -> cl_spraydisable
// ===========================================================================

// -- sprays -----------------------------------------------------------------
cl_spraydisable 1                          // Disable player sprays
r_spray_lifetime 0                         // Number of rounds player sprays are visible

// -- shadows ----------------------------------------------------------------
r_shadows 0
r_shadowrendertotexture 0
r_shadowmaxrendered 0
cl_blobbyshadows 1

// -- faces and models -------------------------------------------------------
r_eyes 0
r_flex 0
r_teeth 0
r_eyemove 0
r_lod 2
r_rootlod 2                                // Root LOD
r_staticprop_lod 4
// "Skip jiggle bone simulation if framerate drops below this value". So a HIGH
// number means always skipped. mastercomfig uses 0 for off, which by the literal
// reading means "skip below 0 fps" -- never -- so it would be always ON. Not
// worth depending on a special case: 999 is unambiguous.
cl_jiggle_bone_framerate_cutoff 999        // Skip jiggle bone simulation if framerate drops below this value (frames/sec...

// -- ragdolls and gibs ------------------------------------------------------
cl_ragdoll_fade_time 0
cl_ragdoll_forcefade 1
cl_ragdoll_physics_enable 0                // Enable/disable ragdoll physics
ragdoll_sleepaftertime 0                   // After this many seconds of being basically stationary, the ragdoll will go...
cl_phys_props_enable 0                     // Disable clientside physics props (must be set before loading a level)
cl_phys_props_max 0                        // Maximum clientside physic props
props_break_max_pieces 0                   // Maximum prop breakable piece count (-1 = model default)
violence_agibs 0                           // Show alien gib entities
violence_hgibs 0                           // Show human gib entities
violence_ablood 1                          // Draw alien blood
violence_hblood 1                          // Draw human blood

// -- world ------------------------------------------------------------------
cl_detaildist 0                            // Distance at which detail props are no longer visible
cl_detailfade 0                            // Distance across which detail props fade in
cl_drawmonitors 0
cl_ejectbrass 0
cl_new_impact_effects 0
cl_show_splashes 0
func_break_max_pieces 0
lod_transitiondist 0
r_3dsky 0                                  // Enable the rendering of 3d sky boxes
r_drawdetailprops 0                        // 0=Off, 1=Normal, 2=Wireframe
r_propsmaxdist 0                           // Maximum visible distance
r_decals 9
mp_decals 9
r_maxmodeldecal 9
r_drawmodeldecals 0
r_decalstaticprops 0                       // Decal static props test
r_decal_cullsize 15
r_drawflecks 0
r_renderoverlayfragment 0
tracer_extra 0

// -- ropes ------------------------------------------------------------------
// r_drawropes is cheat-flagged, so it cannot be set on a normal server.
// mastercomfig sets it anyway, where it silently does nothing.
rope_averagelight 0                        // Makes ropes use average of cubemap lighting instead of max intensity
rope_collide 0                             // Collide rope with the world
rope_rendersolid 0
rope_shake 0
rope_smooth 0                              // Do an antialiasing effect on ropes
rope_subdiv 0                              // Rope subdivision amount
rope_wind_dist 0                           // Don't use CPU applying small wind gusts to ropes when they're past this dis...

// -- water ------------------------------------------------------------------
r_waterdrawreflection 0                    // Enable water reflection
r_waterdrawrefraction 1                    // Enable water refraction
r_waterforceexpensive 0
r_waterforcereflectentities 0
r_cheapwaterstart 1
r_cheapwaterend 1

// -- lighting ---------------------------------------------------------------
r_dynamic 0
r_ambientboost 0                           // Set to boost ambient term if it is totally swamped by local lights
r_ambientfactor 0                          // Boost ambient cube by no more than this factor
r_ambientmin 0                             // Threshold above which ambient cube will not boost (i.e. it's already suffic...
r_lightaverage 0                           // Activates/deactivate light averaging
r_maxdlights 1
r_flashlightdepthtexture 0
r_occlusion 0                              // Activate/deactivate the occlusion system

// -- materials --------------------------------------------------------------
mat_antialias 1
mat_alphacoverage 0
mat_bumpmap 0
mat_specular 0                             // Enable/Disable specularity for perf testing.  Will cause a material reload...
mat_phong 0
mat_colorcorrection 0
mat_colcorrection_disableentities 1        // Disable map color-correction entities
mat_disable_bloom 1
mat_disable_fancy_blending 1
mat_disable_lightwarp 1
mat_envmapsize 8
mat_envmaptgasize 8
mat_filterlightmaps 1
mat_filtertextures 1
mat_forceaniso 1
mat_hdr_level 0                            // Set to 0 for no HDR, 1 for LDR+bloom on HDR maps, and 2 for full HDR on HDR...
mat_max_worldmesh_vertices 512
mat_motion_blur_enabled 0
mat_picmip 2
mat_reducefillrate 1
mat_reduceparticles 1
mat_trilinear 0
mat_viewportscale 1                        // Scale down the main viewport (to reduce GPU impact on CPU profiling)
mat_viewportupscale 1                      // Scale the viewport back up
mat_wateroverlaysize 1
mat_vsync 0                                // Force sync to vertical retrace
mat_monitorgamma 1.6                       // monitor gamma (typically 2.2 for CRT and 1.7 for LCD)

// -- particles and weather --------------------------------------------------
tf_particles_disable_weather 1             // Disable particles related to weather effects
cl_particle_batch_mode 2

// -- threading --------------------------------------------------------------
mat_queue_mode -1                          // The queue/thread mode the material system should use: -1=default, 0=synchro...
r_queued_decals 0                          // Offloads a bit of decal rendering setup work to the material system queue w...
r_queued_ropes 1
r_queued_post_processing 0
r_threaded_client_shadow_manager 1
r_threaded_particles 1
r_threaded_renderables 1
cl_threaded_client_leaf_system 0
net_queue_trace 0

// -- sound ------------------------------------------------------------------
dsp_enhance_stereo 0
dsp_slow_cpu 1
snd_pitchquality 0
snd_spatialize_roundrobin 1                // Lowend optimization: if nonzero, spatialize only a fraction of sound channe...
snd_mixahead 0.05

// -- HUD --------------------------------------------------------------------
cl_hud_playerclass_use_playermodel 0       // Use player model in player class HUD
glow_outline_effect_enable 1               // Enable entity outline glow effects

echo "low.cfg loaded -- max frames"
