// ===========================================================================
// low.cfg -- max frames, for playing.
//
// Descended from Comanglia's config (v1.4, 2014), which was good at its job.
// Refreshed against `cvarlist` on 2026-08-16: seven of its cvars no longer
// exist and are gone rather than left to print "Unknown command".
//
//   removed, no modern equivalent:  mat_shadowstate  mat_parallaxmap
//                                   cl_threaded_bone_setup  cl_cloud_settings
//                                   cl_loadondemand_default  cl_forcepreload
//   renamed:                        cl_playerspraydisable -> cl_spraydisable
//
// Comments after a cvar are TF2's OWN help text, verbatim from cvarlist. A `~`
// marks one written here instead, because Valve ships no description for that
// cvar. Where a `~` line says "undocumented", nobody knows -- including me.
// ===========================================================================

// -- sprays -----------------------------------------------------------------
cl_spraydisable 1                          // Disable player sprays
r_spray_lifetime 0                         // Number of rounds player sprays are visible

// -- shadows ----------------------------------------------------------------
r_shadows 0                                // ~ draw shadows at all
r_shadowrendertotexture 0                  // ~ shaped render-to-texture shadows instead of blobs
r_shadowmaxrendered 0                      // ~ how many shaped shadows may be drawn at once
cl_blobbyshadows 1                         // ~ cheap round blob shadows

// -- faces and models -------------------------------------------------------
r_eyes 0                                   // ~ draw eyeballs
r_flex 0                                   // ~ facial flex animation
r_teeth 0                                  // ~ draw teeth
r_eyemove 0                                // ~ eyes track targets
r_lod 2                                    // ~ force a model level of detail; higher is cruder, -1 is automatic
r_rootlod 2                                // Root LOD
r_staticprop_lod 4                         // ~ force a level of detail for static props
// "Skip jiggle bone simulation if framerate drops below this value". So a HIGH
// number means always skipped. mastercomfig uses 0 for off, which by the literal
// reading means "skip below 0 fps" -- never -- so it would be always ON. Not
// worth depending on a special case: 999 is unambiguous.
cl_jiggle_bone_framerate_cutoff 999        // Skip jiggle bone simulation if framerate drops below this value (frames/sec...

// -- ragdolls and gibs ------------------------------------------------------
cl_ragdoll_fade_time 0                     // ~ seconds before a ragdoll fades out
cl_ragdoll_forcefade 1                     // ~ fade ragdolls immediately
cl_ragdoll_physics_enable 0                // Enable/disable ragdoll physics
ragdoll_sleepaftertime 0                   // After this many seconds of being basically stationary, the ragdoll will go...
cl_phys_props_enable 0                     // Disable clientside physics props (must be set before loading a level)
cl_phys_props_max 0                        // Maximum clientside physic props
props_break_max_pieces 0                   // Maximum prop breakable piece count (-1 = model default)
violence_agibs 0                           // Show alien gib entities
violence_hgibs 0                           // Show human gib entities
violence_ablood 1                          // Draw alien blood
violence_hblood 1                          // Draw human blood

// -- world ------------------------------------------------------------------
cl_detaildist 0                            // Distance at which detail props are no longer visible
cl_detailfade 0                            // Distance across which detail props fade in
cl_drawmonitors 0                          // ~ render in-world camera and monitor screens
cl_ejectbrass 0                            // ~ eject shell casings
cl_new_impact_effects 0                    // ~ the newer bullet impact effect system
cl_show_splashes 0                         // ~ water splash effects
func_break_max_pieces 0                    // ~ max pieces a breakable brush produces
lod_transitiondist 0                       // ~ distance over which model LOD swaps
r_3dsky 0                                  // Enable the rendering of 3d sky boxes
r_drawdetailprops 0                        // 0=Off, 1=Normal, 2=Wireframe
r_propsmaxdist 0                           // Maximum visible distance
r_decals 9                                 // ~ max decals in the world
mp_decals 9                                // ~ max decals, multiplayer
r_maxmodeldecal 9                          // ~ max decals on models
r_drawmodeldecals 0                        // ~ draw decals on models at all
r_decalstaticprops 0                       // Decal static props test
r_decal_cullsize 15                        // ~ cull decals smaller than this in pixels
r_drawflecks 0                             // ~ small debris flecks thrown from impacts
r_renderoverlayfragment 0                  // ~ draw map overlay decals, the art on walls
tracer_extra 0                             // ~ extra bullet tracers

// -- ropes ------------------------------------------------------------------
// r_drawropes is cheat-flagged, so it cannot be set on a normal server.
// mastercomfig sets it anyway, where it silently does nothing.
rope_averagelight 0                        // Makes ropes use average of cubemap lighting instead of max intensity
rope_collide 0                             // Collide rope with the world
rope_rendersolid 0                         // ~ solid rather than wireframe ropes
rope_shake 0                               // ~ ropes shake
rope_smooth 0                              // Do an antialiasing effect on ropes
rope_subdiv 0                              // Rope subdivision amount
rope_wind_dist 0                           // Don't use CPU applying small wind gusts to ropes when they're past this dis...

// -- water ------------------------------------------------------------------
r_waterdrawreflection 0                    // Enable water reflection
r_waterdrawrefraction 1                    // Enable water refraction
r_waterforceexpensive 0                    // ~ full reflective water rather than the cheap path
r_waterforcereflectentities 0              // ~ reflect players and props in water
r_cheapwaterstart 1                        // ~ distance at which water switches to the cheap path
r_cheapwaterend 1                          // ~ distance at which cheap water ends

// -- lighting ---------------------------------------------------------------
r_dynamic 0                                // ~ dynamic lights
r_ambientboost 0                           // Set to boost ambient term if it is totally swamped by local lights
r_ambientfactor 0                          // Boost ambient cube by no more than this factor
r_ambientmin 0                             // Threshold above which ambient cube will not boost (i.e. it's already suffic...
r_lightaverage 0                           // Activates/deactivate light averaging
r_maxdlights 1                             // ~ how many dynamic lights at once
r_flashlightdepthtexture 0                 // ~ projected-texture shadows for flashlights and spotlights
r_occlusion 0                              // Activate/deactivate the occlusion system

// -- materials --------------------------------------------------------------
mat_antialias 1                            // ~ MSAA sample count; 1 is off
mat_alphacoverage 0                        // ~ alpha-to-coverage antialiasing on cutout textures
mat_bumpmap 0                              // ~ normal maps
mat_specular 0                             // Enable/Disable specularity for perf testing.  Will cause a material reload...
mat_phong 0                                // ~ phong specular highlights on models
mat_colorcorrection 0                      // ~ map colour correction
mat_colcorrection_disableentities 1        // Disable map color-correction entities
mat_disable_bloom 1                        // ~ bloom
mat_disable_fancy_blending 1               // ~ blend-modulate material blending
mat_disable_lightwarp 1                    // ~ lightwarp textures
mat_envmapsize 8                           // ~ cubemap resolution
mat_envmaptgasize 8                        // ~ cubemap source resolution
mat_filterlightmaps 1                      // ~ filter lightmaps rather than showing hard luxels
mat_filtertextures 1                       // ~ texture filtering at all
mat_forceaniso 1                           // ~ anisotropic filtering level
mat_hdr_level 0                            // Set to 0 for no HDR, 1 for LDR+bloom on HDR maps, and 2 for full HDR on HDR...
mat_max_worldmesh_vertices 512             // ~ undocumented; world mesh batch size
mat_motion_blur_enabled 0                  // ~ motion blur
mat_picmip 2                               // ~ texture detail as a mip offset; lower is sharper, -1 is the maximum
// mat_reducefillrate 1 CRASHES TF2, measured 2026-08-16.
//
// It is TF2's "Shader Detail: Low" switch, and it moves the material system to
// the Shader Model 2.0b path. On this machine that path is broken:
//
//   Shader 'shaders\fxc\vertexlit_and_unlit_generic_bump_ps20b.vcs'
//     - Couldn't load combo 849480 of shader (dyn=60)
//
// then the client dies. Reproduced twice: once via `exec low`, once by typing
// the single cvar from a working ultra state, which is what isolated it.
//
// Not worked around, removed. The whole point of the cvar is picking cheap
// shaders, and a decade on "cheap" means a path Valve barely maintains -- worth
// nothing on a 3060 and it takes the game down.
mat_reduceparticles 1                      // ~ fewer particles
mat_trilinear 0                            // ~ trilinear rather than bilinear mip filtering
mat_viewportscale 1                        // Scale down the main viewport (to reduce GPU impact on CPU profiling)
mat_viewportupscale 1                      // Scale the viewport back up
mat_wateroverlaysize 1                     // ~ water overlay render target size
mat_vsync 0                                // Force sync to vertical retrace
mat_monitorgamma 1.6                       // monitor gamma (typically 2.2 for CRT and 1.7 for LCD)

// -- particles and weather --------------------------------------------------
tf_particles_disable_weather 1             // Disable particles related to weather effects
cl_particle_batch_mode 2                   // ~ undocumented; particle batching strategy

// -- threading --------------------------------------------------------------
mat_queue_mode -1                          // The queue/thread mode the material system should use: -1=default, 0=synchro...
r_queued_decals 0                          // Offloads a bit of decal rendering setup work to the material system queue w...
r_queued_ropes 1                           // ~ offload rope setup to the material queue
r_queued_post_processing 0                 // ~ offload post-processing to the material queue
r_threaded_client_shadow_manager 1         // ~ shadow manager on its own thread
r_threaded_particles 1                     // ~ particles on their own thread
r_threaded_renderables 1                   // ~ renderable setup threaded
cl_threaded_client_leaf_system 0           // ~ threaded leaf system; historically crash-prone
net_queue_trace 0                          // ~ undocumented; network queue tracing

// -- sound ------------------------------------------------------------------
dsp_enhance_stereo 0                       // ~ stereo widening DSP
dsp_slow_cpu 1                             // ~ cheaper DSP processing
snd_pitchquality 0                         // ~ high quality pitch shifting
snd_spatialize_roundrobin 1                // Lowend optimization: if nonzero, spatialize only a fraction of sound channe...
snd_mixahead 0.05                          // ~ seconds of audio buffered; lower is less latency, more risk of stutter

// -- HUD --------------------------------------------------------------------
cl_hud_playerclass_use_playermodel 0       // Use player model in player class HUD
glow_outline_effect_enable 1               // Enable entity outline glow effects

echo "low.cfg loaded -- max frames"
