// Per-slot viewmodel switcher.
//
// Hides the viewmodel on the gun slots and shows it on melee and the utility slots,
// replacing a blanket `tf_use_min_viewmodels 1`. Guns are hidden because the model
// covers screen for no information; melee is shown because the swing animation IS the
// information, and the utility slots (Spy's watch and disguise kit, Engineer's build
// and destroy PDAs) are shown for the same reason.
//
//   slot1  primary     hidden
//   slot2  secondary   hidden   (Spy overrides this -- the sapper is shown)
//   slot3  melee       shown
//   slot4  utility     shown
//   slot5  utility     shown
//
// Every class cfg execs this FIRST, so per-class overrides below it cannot leak into
// the next class. That matters: a class cfg only runs on class change, so anything not
// reset here would persist.

alias vm_hide "r_drawviewmodel 0"
alias vm_show "r_drawviewmodel 1"

alias s1 "slot1; vm_hide"
alias s2 "slot2; vm_hide"
alias s3 "slot3; vm_show"
alias s4 "slot4; vm_show"
alias s5 "slot5; vm_show"

bind 1 s1
bind 2 s2
bind 3 s3
bind 4 s4
bind 5 s5

// lastinv is the hole in any switcher of this kind: TF2 offers no way to ask which
// slot you just landed on, so the alias cannot know whether to show or hide. It is
// bound to BOTH q and mouse5 here.
//
// Treated as "switching between the two guns", which is what lastinv does in practice
// because melee is reached with 3. Wrong only if you lastinv INTO melee, and the fix
// when that happens is to press 3.
alias lastinv_vm "lastinv; vm_hide"
bind q lastinv_vm
bind mouse5 lastinv_vm

// Start hidden -- you spawn holding primary.
vm_hide
