// Per-slot viewmodel switcher.
//
// Guns hidden, melee shown. Rebuilt from the crosshair/viewmodel switcher in this
// repo's first commit (cfg/crosshairswitcher/), keeping its state machine and dropping
// the crosshair half, which is no longer wanted.
//
// Original authorship not established. The repo owner believes it was Chris, of the
// Chris' TF2 configs that were the standard of that era, which would fit -- the state
// machine below is a properly thought-out answer to a problem most switchers ignore.
// Recorded as his recollection rather than as fact.
//
// The state machine is the part worth keeping. A naive switcher binds 1/2/3 and gets
// lastweapon wrong, because TF2 offers no way to ask which slot you just landed on.
// This tracks it instead: SIX states, two per slot, each encoding which slot you came
// FROM. So `lastweapon` always knows its destination and the viewmodel is always right.
//
//   p_from_s   on primary, arrived from secondary   -> lastweapon goes to secondary
//   p_from_m   on primary, arrived from melee       -> lastweapon goes to melee
//   ...and so on for s_ and m_.
//
// Requires tf_remember_activeweapon 1, set at the bottom.

// ---------------------------------------------------------------------------------
// Modes
// ---------------------------------------------------------------------------------
// viewmodel_fov 0 with the model off hides the particles too. Setting it to 70 while
// still off keeps them: flames, syringes and the medigun beam originate from the
// viewmodel, so they need a sane fov even when the model itself is not drawn.
//
// The medigun case was the uncertain one -- the original config only ever used this
// mode on Medic's PRIMARY, never the medigun, so whether a healing beam survived it was
// untested. Confirmed in game 2026-08-20: beam draws, gun does not.
alias vm_off        "viewmodel_fov 0;  r_drawviewmodel 0"
alias vm_off_fx     "viewmodel_fov 70; r_drawviewmodel 0"
alias vm_on         "viewmodel_fov 84; r_drawviewmodel 1"

// ---------------------------------------------------------------------------------
// Per class: primary / secondary / melee
// ---------------------------------------------------------------------------------
// Melee is shown everywhere -- the swing animation is the information. Guns are hidden
// everywhere; the model covers screen and tells you nothing you do not already know.
//
// Three exceptions, all deliberate:
//   Pyro primary    particles (flames) must still draw
//   Medic both guns particles: syringes/bolts, and the medigun BEAM
//   Spy  secondary  the sapper is a utility item, not a gun, and placing it is worth seeing

alias vm_scout_p    vm_off
alias vm_scout_s    vm_off
alias vm_scout_m    vm_on

alias vm_soldier_p  vm_off
alias vm_soldier_s  vm_off
alias vm_soldier_m  vm_on

alias vm_pyro_p     vm_off_fx
alias vm_pyro_s     vm_off
alias vm_pyro_m     vm_on

alias vm_demoman_p  vm_off
alias vm_demoman_s  vm_off
alias vm_demoman_m  vm_on

alias vm_heavy_p    vm_off
alias vm_heavy_s    vm_off
alias vm_heavy_m    vm_on

alias vm_engineer_p vm_off
alias vm_engineer_s vm_off
alias vm_engineer_m vm_on

alias vm_medic_p    vm_off_fx
alias vm_medic_s    vm_off_fx
alias vm_medic_m    vm_on

alias vm_sniper_p   vm_off
alias vm_sniper_s   vm_off
alias vm_sniper_m   vm_on

alias vm_spy_p      vm_off
alias vm_spy_s      vm_on
alias vm_spy_m      vm_on

// ---------------------------------------------------------------------------------
// State machine
// ---------------------------------------------------------------------------------
// vmp / vms / vmm are rebound per class below; these six only ever call those.
alias p_from_s "slot1; vmp; alias w1 p_from_s; alias w2 s_from_p; alias w3 m_from_p; alias lw s_from_p"
alias p_from_m "slot1; vmp; alias w1 p_from_m; alias w2 s_from_p; alias w3 m_from_p; alias lw m_from_p"
alias s_from_p "slot2; vms; alias w1 p_from_s; alias w2 s_from_p; alias w3 m_from_s; alias lw p_from_s"
alias s_from_m "slot2; vms; alias w1 p_from_s; alias w2 s_from_m; alias w3 m_from_s; alias lw m_from_s"
alias m_from_p "slot3; vmm; alias w1 p_from_m; alias w2 s_from_m; alias w3 m_from_p; alias lw p_from_m"
alias m_from_s "slot3; vmm; alias w1 p_from_m; alias w2 s_from_m; alias w3 m_from_s; alias lw s_from_m"

// ---------------------------------------------------------------------------------
// Class entry points -- a class cfg calls one of these
// ---------------------------------------------------------------------------------
alias vm_scout    "alias vmp vm_scout_p;    alias vms vm_scout_s;    alias vmm vm_scout_m;    p_from_s"
alias vm_soldier  "alias vmp vm_soldier_p;  alias vms vm_soldier_s;  alias vmm vm_soldier_m;  p_from_s"
alias vm_pyro     "alias vmp vm_pyro_p;     alias vms vm_pyro_s;     alias vmm vm_pyro_m;     p_from_s"
alias vm_demoman  "alias vmp vm_demoman_p;  alias vms vm_demoman_s;  alias vmm vm_demoman_m;  p_from_s"
alias vm_heavy    "alias vmp vm_heavy_p;    alias vms vm_heavy_s;    alias vmm vm_heavy_m;    p_from_s"
alias vm_engineer "alias vmp vm_engineer_p; alias vms vm_engineer_s; alias vmm vm_engineer_m; p_from_s"
alias vm_medic    "alias vmp vm_medic_p;    alias vms vm_medic_s;    alias vmm vm_medic_m;    p_from_s"
alias vm_sniper   "alias vmp vm_sniper_p;   alias vms vm_sniper_s;   alias vmm vm_sniper_m;   p_from_s"
alias vm_spy      "alias vmp vm_spy_p;      alias vms vm_spy_s;      alias vmm vm_spy_m;      p_from_s"

// ---------------------------------------------------------------------------------
// Binds
// ---------------------------------------------------------------------------------
// Letter binds carried over verbatim from the original cfg/crosshairswitcher/binds.cfg:
//
//     bind q  weapon1      primary
//     bind r  weapon2      secondary
//     bind f  weapon3      melee
//     bind MOUSE5  lastweapon
//
// weapon1/2/3 and lastweapon were that switcher's alias names; w1/w2/w3 and lw are the
// same things here.
bind q w1
bind r w2
bind f w3
bind mouse5 lw

// Taking r costs you +reload, which TF2 has there by default. The original config
// solved this by moving reload to h -- its config.cfg line 19 reads bind "h" "+reload"
// -- so that is carried over here, next to the bind that made it necessary.
bind h +reload

// Taking f costs +inspect. The original did not rebind it anywhere, so it was simply
// given up. Left that way; add a bind here if you want it back.

// The number row is bound to the state machine too, which the original did NOT do -- it
// left 1/2/3 at TF2's defaults. That was a latent bug: pressing a number went straight
// to slot1/2/3 without updating the machine, so the next lastweapon press would show or
// hide the wrong viewmodel. Binding them here means neither input can desync it.
bind 1 w1
bind 2 w2
bind 3 w3

// Slots 4 and 5 are outside the state machine -- only Spy (disguise kit, watch) and
// Engineer (build, destroy PDA) have them, and lastweapon does not target them. Shown,
// and pressing 1/2/3 re-enters the machine cleanly.
alias vm_slot4 "slot4; vm_on"
alias vm_slot5 "slot5; vm_on"
bind 4 vm_slot4
bind 5 vm_slot5

// The quickswitch menu needs the raw slot commands while it is open, then the binds back.
alias +quickswitchmenu "+quickswitch; bind 1 slot1; bind 2 slot2; bind 3 slot3"
alias -quickswitchmenu "-quickswitch; bind 1 w1; bind 2 w2; bind 3 w3"
bind \ +quickswitchmenu

tf_remember_activeweapon 1
