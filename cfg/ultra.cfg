// ===========================================================================
// ultra.cfg -- max quality, and a reproducible one.
//
// This is the state Tf2DemoSalvage's renderer is compared against, so a few
// settings are chosen for PARITY rather than for looking best. Those are
// marked. Everything else is simply as high as TF2 goes.
//
// Verified against `cvarlist` on 2026-08-16: every cvar here exists and none is
// cheat-flagged.
//
// Comments after a cvar are TF2's OWN help text, verbatim from cvarlist. A `~`
// marks one written here instead, because Valve ships no description for that
// cvar. Where a `~` line says "undocumented", nobody knows -- including me.
// ===========================================================================

// -- PARITY: LDR, not HDR ---------------------------------------------------
// mat_hdr_level picks which baked lighting set TF2 reads out of the BSP, and
// Tf2DemoSalvage reads the LDR one and does not tonemap. At level 2 the game
// and the viewer light the same map from different data, which no shader work
// can reconcile.
//
// It also removes Source's adaptive exposure, which drifts based on what was
// recently on screen -- so two captures of one camera position can differ.
// Every mat_tonemap_* control is cheat-flagged, so this is the only lever that
// works on a normal server.
mat_hdr_level 0                            // Set to 0 for no HDR, 1 for LDR+bloom on HDR maps, and 2 for full HDR on HDR...
mat_colorcorrection 0                      // ~ map colour correction
mat_colcorrection_disableentities 1        // Disable map color-correction entities

// -- PARITY: no MSAA --------------------------------------------------------
// Capture is at desktop resolution and downscaled, which is already
// supersampling AA applied to both sides. MSAA would antialias TF2's edges a
// second time and the viewer's once.
mat_antialias 1                            // ~ MSAA sample count; 1 is off
mat_alphacoverage 0                        // ~ alpha-to-coverage antialiasing on cutout textures

// -- PARITY: nothing that varies with time or other players -----------------
// Jigglebones: skip only below 1 fps, i.e. always simulated, so the same scene
// draws the same regardless of framerate.
cl_jiggle_bone_framerate_cutoff 1          // Skip jiggle bone simulation if framerate drops below this value (frames/sec...
// Sprays are other players' images appearing in your frame.
cl_spraydisable 1                          // Disable player sprays
r_spray_lifetime 0                         // Number of rounds player sprays are visible
cl_allowdownload 0                         // Client downloads customization files
// Killstreak sheens animate. tf_sheen_framerate does not exist in current TF2,
// so first-person alpha is the only control left; world sheens still animate
// and a sheened weapon in frame still makes a capture time-dependent.
tf_sheen_alpha_firstperson 0               // Set the Alpha Value for first person sheens
mat_motion_blur_enabled 0                  // ~ motion blur

// -- textures ---------------------------------------------------------------
// -1 is TF2's own maximum. Lower values are stored but do nothing: a VTF's LOD
// resource caps size at (1 << m_ResolutionClamp) and picmip subtracts from that
// exponent, while the texture's own mip 0 is a hard ceiling. mastercomfig's -10
// also crashes the client through mat_texture_list.
mat_picmip -1                              // ~ texture detail as a mip offset; lower is sharper, -1 is the maximum
mat_forceaniso 16                          // ~ anisotropic filtering level
mat_filtertextures 1                       // ~ texture filtering at all
mat_filterlightmaps 1                      // ~ filter lightmaps rather than showing hard luxels
mat_trilinear 1                            // ~ trilinear rather than bilinear mip filtering

// -- models and faces -------------------------------------------------------
r_lod 0                                    // ~ force a model level of detail; higher is cruder, -1 is automatic
r_rootlod 0                                // Root LOD
r_staticprop_lod 0                         // ~ force a level of detail for static props
r_eyes 1                                   // ~ draw eyeballs
r_eyemove 1                                // ~ eyes track targets
r_flex 1                                   // ~ facial flex animation
r_teeth 1                                  // ~ draw teeth
flex_rules 1                               // Allow flex animation rules to run
flex_smooth 1                              // Applies smoothing/decay curve to flex animation controller changes
anim_3wayblend 1                           // Toggle the 3-way animation blending code
tf_clientsideeye_lookats 1                 // When on, players will turn their pupils to look at nearby players

// -- lighting ---------------------------------------------------------------
r_dynamic 1                                // ~ dynamic lights
r_maxdlights 32                            // ~ how many dynamic lights at once
r_ambientboost 1                           // Set to boost ambient term if it is totally swamped by local lights
r_lightaverage 1                           // Activates/deactivate light averaging
mat_disable_lightwarp 0                    // ~ lightwarp textures
r_worldlights 4                            // number of world lights to use per vertex
mat_bumpmap 1                              // ~ normal maps
mat_specular 1                             // Enable/Disable specularity for perf testing.  Will cause a material reload...
mat_phong 1                                // ~ phong specular highlights on models
r_rimlight 1                               // ~ rim lighting on models
mat_reducefillrate 0                       // ~ pick cheaper shaders
mat_disable_fancy_blending 0               // ~ blend-modulate material blending

// -- shadows ----------------------------------------------------------------
r_shadows 1                                // ~ draw shadows at all
r_shadowrendertotexture 1                  // ~ shaped render-to-texture shadows instead of blobs
r_shadowmaxrendered 160                    // ~ how many shaped shadows may be drawn at once
cl_blobbyshadows 0                         // ~ cheap round blob shadows
nb_shadow_dist 8192                        // ~ undocumented; NextBot shadow distance
r_flashlightdepthtexture 1                 // ~ projected-texture shadows for flashlights and spotlights
r_flashlightdepthres 1024                  // ~ shadow map resolution for those projected textures
r_flashlightmodels 1                       // ~ models are lit by projected textures
r_flashlightrender 1                       // ~ render projected textures at all
r_flashlightculldepth 1                    // ~ undocumented; depth culling for projected textures

// -- world ------------------------------------------------------------------
r_3dsky 1                                  // Enable the rendering of 3d sky boxes
r_drawdetailprops 1                        // 0=Off, 1=Normal, 2=Wireframe
r_decalstaticprops 1                       // Decal static props test
r_propsmaxdist 8192                        // Maximum visible distance
cl_detaildist 8592                         // Distance at which detail props are no longer visible
cl_detailfade 400                          // Distance across which detail props fade in
cl_phys_props_enable 1                     // Disable clientside physics props (must be set before loading a level)
cl_phys_props_max 100                      // Maximum clientside physic props
lod_transitiondist 3592                    // ~ distance over which model LOD swaps
props_break_max_pieces -1                  // Maximum prop breakable piece count (-1 = model default)

// -- decals -----------------------------------------------------------------
r_decals 2048                              // ~ max decals in the world
mp_decals 2048                             // ~ max decals, multiplayer
r_drawmodeldecals 1                        // ~ draw decals on models at all
r_maxmodeldecal 50                         // ~ max decals on models
r_renderoverlayfragment 1                  // ~ draw map overlay decals, the art on walls
r_decal_cover_count 4                      // ~ undocumented; decal overlap budget
r_decal_overlap_count 3                    // ~ undocumented; decal overlap budget
r_drawbatchdecals 1                        // Render decals batched

// -- ropes ------------------------------------------------------------------
// r_drawropes is cheat-flagged and cannot be set on a normal server.
rope_rendersolid 1                         // ~ solid rather than wireframe ropes
rope_smooth 1                              // Do an antialiasing effect on ropes
rope_subdiv 7                              // Rope subdivision amount
rope_collide 1                             // Collide rope with the world
rope_wind_dist 8192                        // Don't use CPU applying small wind gusts to ropes when they're past this dis...
r_ropetranslucent 1                        // ~ draw ropes as translucent

// -- water ------------------------------------------------------------------
r_waterdrawreflection 1                    // Enable water reflection
r_waterdrawrefraction 1                    // Enable water refraction
r_waterforceexpensive 1                    // ~ full reflective water rather than the cheap path
r_waterforcereflectentities 1              // ~ reflect players and props in water
tf_water_resolution 2048                   // Needs to be set at game launch time to override
r_cheapwaterstart 8192                     // ~ distance at which water switches to the cheap path
r_cheapwaterend 8193                       // ~ distance at which cheap water ends

// -- effects ----------------------------------------------------------------
cl_show_splashes 1                         // ~ water splash effects
cl_ejectbrass 1                            // ~ eject shell casings
cl_drawmonitors 1                          // ~ render in-world camera and monitor screens
tf_monitor_resolution 1024                 // Needs to be set at game launch time to override
r_drawflecks 1                             // ~ small debris flecks thrown from impacts
mat_reduceparticles 0                      // ~ fewer particles
tf_particles_disable_weather 0             // Disable particles related to weather effects
cl_particle_batch_mode 0                   // ~ undocumented; particle batching strategy
tracer_extra 1                             // ~ extra bullet tracers
r_drawtracers_firstperson 1                // Toggle visibility of first person weapon tracers
muzzleflash_light 1                        // ~ dynamic light from muzzle flashes
cl_muzzleflash_dlight_1st 1                // ~ muzzle flash dynamic light in first person

// -- ragdolls and gibs ------------------------------------------------------
cl_ragdoll_fade_time 15                    // ~ seconds before a ragdoll fades out
cl_ragdoll_forcefade 0                     // ~ fade ragdolls immediately
cl_ragdoll_physics_enable 1                // Enable/disable ragdoll physics
cl_ragdoll_collide 1                       // ~ ragdolls collide with each other
ragdoll_sleepaftertime 5                   // After this many seconds of being basically stationary, the ragdoll will go...
cl_burninggibs 1                           // A burning player that gibs has burning gibs
tf_playergib 1                             // Allow player gibbing. 0: never, 1: normal, 2: always
violence_agibs 1                           // Show alien gib entities
violence_hgibs 1                           // Show human gib entities
violence_ablood 1                          // Draw alien blood
violence_hblood 1                          // Draw human blood

// -- outlines and pyrovision ------------------------------------------------
glow_outline_effect_enable 1               // Enable entity outline glow effects
tf_enable_glows_after_respawn 1            // Enable teammate glow effects after respawn
pyro_dof 1                                 // ~ pyrovision depth of field
pyro_vignette 2                            // ~ pyrovision vignette

// -- threading and presentation ---------------------------------------------
mat_queue_mode -1                          // The queue/thread mode the material system should use: -1=default, 0=synchro...
mat_vsync 0                                // Force sync to vertical retrace
r_threaded_particles 1                     // ~ particles on their own thread
r_threaded_renderables 1                   // ~ renderable setup threaded
r_threaded_client_shadow_manager 1         // ~ shadow manager on its own thread

// -- sound ------------------------------------------------------------------
snd_pitchquality 1                         // ~ high quality pitch shifting
dsp_slow_cpu 0                             // ~ cheaper DSP processing
dsp_enhance_stereo 1                       // ~ stereo widening DSP

echo "ultra.cfg loaded -- max quality, LDR for capture parity"
