// ===========================================================================
// Pin-Config -- always-on settings. Graphics live in low.cfg / ultra.cfg.
//
//   exec low      max frames, for playing
//   exec ultra    max quality, for Tf2DemoSalvage reference capture
//
// Verified against `cvarlist` on TF2, 2026-08-16: every cvar here exists and
// none is cheat-flagged. Seven cvars from the 2014 base were dropped because
// the game no longer has them -- they were printing "Unknown command" and
// looking exactly like settings that worked.
// ===========================================================================

// ---------------------------------------------------------------------------
// Net
// ---------------------------------------------------------------------------
// rate was 60000 in the old config, with a comment claiming anything above
// ~62000 was useless. That ceiling is long gone; 786432 is the current max.
rate 786432
cl_cmdrate 66
cl_updaterate 66
cl_interp 0
cl_interp_ratio 1
cl_lagcompensation 1
cl_pred_optimize 2
cl_smooth 0
cl_smoothtime 0.01

// ---------------------------------------------------------------------------
// Input and frames
// ---------------------------------------------------------------------------
m_rawinput 1
fps_max 0
cl_showfps 0
net_graph 0

// ---------------------------------------------------------------------------
// Binds and scripts
// ---------------------------------------------------------------------------

// Scoreboard also shows net_graph while held.
alias sboardtoggle    "sboardtoggleon"
alias sboardtoggleon  "+showscores; net_graph 1; alias sboardtoggle sboardtoggleoff"
alias sboardtoggleoff "-showscores; net_graph 0; alias sboardtoggle sboardtoggleon"
bind tab sboardtoggle

// Class selection on the keypad.
bind "KP_END"        "join_class scout"
bind "KP_DOWNARROW"  "join_class soldier"
bind "KP_PGDN"       "join_class pyro"
bind "KP_LEFTARROW"  "join_class demoman"
bind "KP_5"          "join_class heavyweapons"
bind "KP_RIGHTARROW" "join_class engineer"
bind "KP_HOME"       "join_class medic"
bind "KP_UPARROW"    "join_class sniper"
bind "KP_PGUP"       "join_class spy"

// Loadout preset toggle.
alias loadout_a "load_itempreset 0; alias loadout_toggle loadout_b"
alias loadout_b "load_itempreset 1; alias loadout_toggle loadout_a"
alias loadout_toggle "loadout_a"
bind "F2" "loadout_toggle"

// Null-cancelling movement: pressing the opposite key releases the first, so a
// counter-strafe stops instead of doing nothing.
//
// The 2014 version also toggled mat_filterlightmaps inside these aliases. That
// changed a render setting on every keypress, which is fine for frames and
// fatal for a reference capture, so it is gone.
bind w +mfwd
bind s +mback
bind a +mleft
bind d +mright

alias +mfwd   "-back;      +forward;   alias checkfwd   +forward"
alias +mback  "-forward;   +back;      alias checkback  +back"
alias +mleft  "-moveright; +moveleft;  alias checkleft  +moveleft"
alias +mright "-moveleft;  +moveright; alias checkright +moveright"
alias -mfwd   "-forward;   checkback;  alias checkfwd   none"
alias -mback  "-back;      checkfwd;   alias checkback  none"
alias -mleft  "-moveleft;  checkright; alias checkleft  none"
alias -mright "-moveright; checkleft;  alias checkright none"
alias checkfwd   none
alias checkback  none
alias checkleft  none
alias checkright none
alias none ""

// Mouse wheel calls for a medic. Note this removes wheel weapon switching.
bind mwheelup   "voicemenu 0 0"
bind mwheeldown "voicemenu 0 0"

// ---------------------------------------------------------------------------
// Nuisance suppression. None of this affects what is drawn in the world.
// ---------------------------------------------------------------------------
cl_ask_blacklist_opt_out 1
cl_ask_favorite_opt_out 1
cl_notifications_show_ingame 0
hud_saytext_time 10
hud_deathnotice_time 5
hud_achievement_count 0
hud_achievement_tracker 0
sb_dontshow_maxplayer_warning 1
tf_explanations_backpackpanel 1
tf_explanations_charinfo_armory_panel 1
tf_explanations_charinfopanel 1
tf_explanations_craftingpanel 1
tf_explanations_discardpanel 1
tf_explanations_store 1
tf_training_has_prompted_for_forums 1
tf_training_has_prompted_for_loadout 1
tf_training_has_prompted_for_offline_practice 1
tf_training_has_prompted_for_options 1
tf_training_has_prompted_for_training 1

// ---------------------------------------------------------------------------
// Pick a profile. Change this line to `exec ultra` to boot into capture mode.
// ---------------------------------------------------------------------------
exec low

echo "==============================================="
echo " Pin-Config loaded.  exec low  |  exec ultra"
echo "==============================================="
