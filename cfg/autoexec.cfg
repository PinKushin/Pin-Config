// ===========================================================================
// Pin-Config -- always-on settings. Graphics live in low.cfg / ultra.cfg.
//
//   exec low      max frames, for playing
//   exec ultra    max quality, for Tf2DemoSalvage reference capture
//
// Verified against `cvarlist` on TF2, 2026-08-16: every cvar here exists and
// none is cheat-flagged. Seven cvars from the 2014 base were dropped because
// the game no longer has them -- they were printing "Unknown command" and
// looking exactly like settings that worked.
//
// Comments after a cvar are TF2's OWN help text, verbatim from cvarlist. A `~`
// marks one written here instead, because Valve ships no description for that
// cvar. Where a `~` line says "undocumented", nobody knows -- including me.
// ===========================================================================

// ---------------------------------------------------------------------------
// Net
// ---------------------------------------------------------------------------
// rate was 60000 in the old config, with a comment claiming anything above
// ~62000 was useless. That ceiling is long gone; 786432 is the current max.
rate 786432                                // Max bytes/sec the host can receive data
cl_cmdrate 66                              // Max number of command packets sent to server per second
cl_updaterate 66                           // Number of packets per second of updates you are requesting from the server
cl_interp 0                                // Sets the interpolation amount (bounded on low side by server interp ratio s...
cl_interp_ratio 1                          // Sets the interpolation amount (final amount is cl_interp_ratio / cl_updater...
cl_lagcompensation 1                       // Perform server side lag compensation of weapon firing events
cl_pred_optimize 2                         // Optimize for not copying data if didn't receive a network update (1), and a...
cl_smooth 0                                // Smooth view/eye origin after prediction errors
cl_smoothtime 0.01                         // Smooth client's view after prediction error over this many seconds

// ---------------------------------------------------------------------------
// Input and frames
// ---------------------------------------------------------------------------
// 8.00 inches per 360 at 800 DPI.
//
//   counts per 360 = 360 / (m_yaw * sensitivity)
//   360 / (0.022 * 2.556818) = 360 / 0.05625 = 6400 counts
//   6400 / 800 dpi = 8.00 inches
//
// m_yaw is pinned rather than left at its default, because the whole figure is
// computed from it -- if anything else changes it the distance moves silently.
// Raw input matters here too: without it Windows pointer speed scales the
// counts and the arithmetic stops describing reality.
m_rawinput 1                               // Use Raw Input for mouse input
m_yaw 0.022                                // Mouse yaw factor
sensitivity 2.556818                       // Mouse sensitivity
fps_max 0                                  // Frame rate limiter, cannot be set while connected to a server
cl_showfps 0                               // Draw fps meter at top of screen (1 = fps, 2 = smooth fps)
net_graph 0                                // Draw the network usage graph, = 2 draws data on payload, = 3 draws payload...

// ---------------------------------------------------------------------------
// Binds and scripts
// ---------------------------------------------------------------------------

// Scoreboard also shows net_graph while held.
alias sboardtoggle    "sboardtoggleon"
alias sboardtoggleon  "+showscores; net_graph 1; alias sboardtoggle sboardtoggleoff"
alias sboardtoggleoff "-showscores; net_graph 0; alias sboardtoggle sboardtoggleon"
bind tab sboardtoggle

// Class selection on the keypad.
bind "KP_END"        "join_class scout"
bind "KP_DOWNARROW"  "join_class soldier"
bind "KP_PGDN"       "join_class pyro"
bind "KP_LEFTARROW"  "join_class demoman"
bind "KP_5"          "join_class heavyweapons"
bind "KP_RIGHTARROW" "join_class engineer"
bind "KP_HOME"       "join_class medic"
bind "KP_UPARROW"    "join_class sniper"
bind "KP_PGUP"       "join_class spy"

// Loadout preset toggle.
alias loadout_a "load_itempreset 0; alias loadout_toggle loadout_b"
alias loadout_b "load_itempreset 1; alias loadout_toggle loadout_a"
alias loadout_toggle "loadout_a"
bind "F2" "loadout_toggle"

// Null-cancelling movement: pressing the opposite key releases the first, so a
// counter-strafe stops instead of doing nothing.
//
// The 2014 version also toggled mat_filterlightmaps inside these aliases. That
// changed a render setting on every keypress, which is fine for frames and
// fatal for a reference capture, so it is gone.
bind w +mfwd
bind s +mback
bind a +mleft
bind d +mright

alias +mfwd   "-back;      +forward;   alias checkfwd   +forward"
alias +mback  "-forward;   +back;      alias checkback  +back"
alias +mleft  "-moveright; +moveleft;  alias checkleft  +moveleft"
alias +mright "-moveleft;  +moveright; alias checkright +moveright"
alias -mfwd   "-forward;   checkback;  alias checkfwd   none"
alias -mback  "-back;      checkfwd;   alias checkback  none"
alias -mleft  "-moveleft;  checkright; alias checkleft  none"
alias -mright "-moveright; checkleft;  alias checkright none"
alias checkfwd   none
alias checkback  none
alias checkleft  none
alias checkright none
alias none ""

// Mouse wheel calls for a medic. Note this removes wheel weapon switching.
bind mwheelup   "voicemenu 0 0"
bind mwheeldown "voicemenu 0 0"

// ---------------------------------------------------------------------------
// Nuisance suppression. None of this affects what is drawn in the world.
// ---------------------------------------------------------------------------
cl_ask_blacklist_opt_out 1                 // If nonzero, don't auto-ask to blacklist servers
cl_ask_favorite_opt_out 1                  // If nonzero, don't auto-ask to favorite servers
cl_notifications_show_ingame 0             // Whether notifications should show up in-game
hud_saytext_time 10                        // ~ seconds chat text stays on screen
hud_deathnotice_time 5                     // ~ seconds kill notices stay on screen
hud_achievement_count 0                    // Max number of achievements that can be shown on the HUD
hud_achievement_tracker 0                  // Show or hide the achievement tracker
sb_dontshow_maxplayer_warning 1            // ~ suppress the server browser max-player warning
tf_explanations_backpackpanel 1            // Whether the user has seen explanations for this panel
tf_explanations_charinfo_armory_panel 1    // Whether the user has seen explanations for this panel
tf_explanations_charinfopanel 1            // Whether the user has seen explanations for this panel
tf_explanations_craftingpanel 1            // Whether the user has seen explanations for this panel
tf_explanations_discardpanel 1             // Whether the user has seen explanations for this panel
tf_explanations_store 1                    // Whether the user has seen explanations for this panel
tf_training_has_prompted_for_forums 1      // Whether the user has been prompted to view the new user forums
tf_training_has_prompted_for_loadout 1     // Whether the user has been prompted to equip something in their loadout
tf_training_has_prompted_for_offline_practice 1 // Whether the user has been prompted to try offline practice
tf_training_has_prompted_for_options 1     // Whether the user has been prompted to view the TF2 advanced options
tf_training_has_prompted_for_training 1    // Whether the user has been prompted for training

// ---------------------------------------------------------------------------
// Pick a profile. Currently ULTRA -- change to `exec low` for playing.
// ---------------------------------------------------------------------------
exec ultra

echo "==============================================="
echo " Pin-Config loaded.  exec low  |  exec ultra"
echo "==============================================="
