// Local tournament-mode test setup, for looking at HudTournament.res.
//
// `exec tournament` on a listen server. Rename or copy this to listenserver.cfg
// if you want it applied automatically to every local server instead -- TF2
// auto-execs that file at server start.
//
// Cvar names and defaults verified against tools/cvarlist.log.

mp_tournament 1                            // ~ enable tournament mode
mp_tournament_readymode 1                  // Enable per-player ready status for tournament mode.
mp_tournament_readymode_min 1              // Minimum number of players required on the server before players can toggle ready status.
mp_tournament_readymode_team_size 0        // Minimum number of players required to be ready per-team before the game can begin.
mp_tournament_stopwatch 0                  // Use Stopwatch mode while using Tournament mode (mp_tournament)

// Applies the above to the running match. Without this, mp_tournament only takes
// effect on the next round.
mp_tournament_restart

echo "tournament test mode on -- F4 to ready up.  exec tournament_off to revert."
